<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Gateway · DeepSeek Harness 页面原型 v2</title>
<link rel="stylesheet" href="./styles.css">
<script src="./app.js" defer></script>
</head>
<body>
<!-- 通用 SVG 图标库 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-chevron-right" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 16 16"><path d="m3 6 5 5 5-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.8 2.8 13.2 5.2 5.5 13H3v-2.5L10.8 2.8ZM9.4 4.2l2.4 2.4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4h11M5.5 4V2.5h5V4M3.5 4l.8 10h7.4l.8-10M6.5 7v4M9.5 7v4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 3.5h4.5l1.5 1.5H14v8H2v-9.5Z"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4V2Z"/><path d="M9 2v3h3M6 8h4M6 11h4"/></symbol>
  <symbol id="i-skill" viewBox="0 0 16 16"><path d="M8 2.5c.7 2.6 1.4 3.3 4 4-2.6.7-3.3 1.4-4 4-.7-2.6-1.4-3.3-4-4 2.6-.7 3.3-1.4 4-4Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m3.5 3.5 9 9M12.5 3.5l-9 9"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3 8.5 3.2 3L13 4.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 4.8v.4"/></symbol>
  <symbol id="i-warning" viewBox="0 0 16 16"><path d="M8 2.5 14.5 14h-13L8 2.5Z"/><path d="M8 7v3M8 11.4v.4"/></symbol>
  <symbol id="i-error" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 16 16"><path d="M8 11V3M4.5 5.5 8 2l3.5 3.5M2.5 11.5V14h11v-2.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></symbol>
  <symbol id="i-stats" viewBox="0 0 16 16"><path d="M2.5 13.5h11M4 10V6.5M8 10V3.5M12 10V5"/></symbol>
  <symbol id="i-gateway" viewBox="0 0 16 16"><circle cx="4" cy="8" r="2.2"/><circle cx="12" cy="8" r="2.2"/><path d="M6.2 8h3.6"/></symbol>
  <symbol id="i-database" viewBox="0 0 16 16"><ellipse cx="8" cy="3.5" rx="5" ry="2"/><path d="M3 3.5v9c0 1.1 2.2 2 5 2s5-.9 5-2v-9"/><path d="M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="m6.5 9.5 3-3M5 7.5 3.5 9a3.5 3.5 0 0 0 5 5l1.5-1.5M11 8.5l1.5-1.5a3.5 3.5 0 0 0-5-5L6 3.5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 16 16"><path d="m8 2.5 6 3.5-6 3.5-6-3.5 6-3.5Z"/><path d="m2.5 9.5 5.5 3 5.5-3"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 16 16"><path d="M13 8H3M6.5 4.5 3 8l3.5 3.5"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 16 16"><path d="M8 13V3M4.5 6.5 8 3l3.5 3.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M2 8s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4Z"/><circle cx="8" cy="8" r="1.8"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.5 5V1.5M13.5 5H10M12.8 9.5A5 5 0 1 1 11 4.6"/></symbol>
  <symbol id="i-panel" viewBox="0 0 16 16"><path d="M10.5 2H14v12h-3.5V2ZM2 2h6v12H2V2Z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 16 16"><path d="M2.5 3.5h11v8h-6L4 14.5v-3H2.5v-8Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2.5 1.5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/></symbol>
  <symbol id="i-book" viewBox="0 0 16 16"><path d="M2.5 3h3.5A2 2 0 0 1 8 5a2 2 0 0 1 2-2h3.5v10H10a2 2 0 0 0-2 2 2 2 0 0 0-2-2H2.5V3Z"/></symbol>
</svg>

<!-- 原型控制条 -->
<header class="proto-bar">
  <div class="proto-brand">
    <span class="proto-mark">SG</span>
    <span class="proto-title">Skill Gateway 页面原型</span>
    <span class="proto-badge">VERSION 2</span>
  </div>
  <p class="proto-note">按 docs/style/deepseek/design.md 规范构建 · 状态仅存内存，刷新即重置 · 场景树上传依赖浏览器 File API</p>
  <div class="proto-actions">
    <button id="mock-agent-skill" class="btn btn-sm btn-ghost" type="button">
      <svg class="icon"><use href="#i-skill"/></svg>模拟默认 skill 调用
    </button>
    <button id="reset-demo" class="btn btn-sm btn-ghost" type="button">
      <svg class="icon"><use href="#i-refresh"/></svg>重置演示数据
    </button>
    <button id="panel-toggle" class="btn btn-sm btn-primary" type="button">
      <svg class="icon"><use href="#i-panel"/></svg>打开 Skill Gateway
    </button>
  </div>
</header>

<div class="app">
  <!-- DSH 左侧导航（设计规范中的侧边导航栏） -->
  <aside class="rail">
    <div class="rail-logo">
      <span class="proto-mark">DS</span>
      <span class="rail-logo-name">DeepSeek Harness</span>
    </div>
    <div class="rail-new">
      <button class="btn btn-primary" type="button">
        <svg class="icon"><use href="#i-plus"/></svg>新建对话
      </button>
    </div>
    <nav class="rail-sessions">
      <div class="rail-group">历史会话</div>
      <button class="rail-item is-active" type="button">
        <svg class="icon"><use href="#i-chat"/></svg>
        <span class="rail-item-text">SQL 索引评审与迁移</span>
      </button>
      <button class="rail-item" type="button">
        <svg class="icon"><use href="#i-chat"/></svg>
        <span class="rail-item-text">React 组件库重构</span>
      </button>
      <button class="rail-item" type="button">
        <svg class="icon"><use href="#i-chat"/></svg>
        <span class="rail-item-text">网关技能目录整理</span>
      </button>
      <button class="rail-item" type="button">
        <svg class="icon"><use href="#i-chat"/></svg>
        <span class="rail-item-text">API 设计评审</span>
      </button>
    </nav>
    <div class="rail-account">
      <span class="avatar">Z</span>
      <span class="rail-account-name">zima@local-workspace</span>
    </div>
  </aside>

  <!-- DSH 会话画布（陪衬，真实产品中 Agent 通过 skill_gateway 工具取用技能） -->
  <main class="workspace">
    <div class="chat-header">
      <div>
        <div class="chat-header-title">SQL 索引评审与迁移</div>
        <div class="chat-header-sub">session_20250815_a1b2 · gateway 已开启</div>
      </div>
    </div>
    <div class="chat-feed" id="chat-feed"></div>
    <div class="chat-composer">
      <div class="chat-input">
        <svg class="icon"><use href="#i-chat"/></svg>
        在真实 DSH 中，Agent 先通过 skill_gateway 逐层浏览，再 load 选定技能。
      </div>
    </div>
  </main>

  <!-- Skill Gateway 插件侧边栏 -->
  <aside class="panel" aria-label="Skill Gateway 侧边栏">
    <header class="panel-header">
      <span class="panel-mark">
        <svg class="icon"><use href="#i-gateway"/></svg>
      </span>
      <div class="panel-title-wrap">
        <div class="panel-title">Skill Gateway</div>
        <div class="panel-subtitle">场景化管理 · 渐进式取用</div>
      </div>
      <label class="switch" title="网关开关：关闭后卸下工具与提示词，统计观察器仍生效">
        <input type="checkbox" id="gateway-toggle" checked>
        <span class="switch-track"></span>
        <span class="switch-label">网关</span>
      </label>
      <button class="icon-btn" id="panel-close" type="button" aria-label="关闭面板">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
    </header>

    <nav class="panel-tabs" aria-label="面板导航">
      <div class="segmented" id="tab-bar">
        <button type="button" data-tab="catalog" class="is-active">
          <svg class="icon"><use href="#i-layers"/></svg>场景树管理
        </button>
        <button type="button" data-tab="stats">
          <svg class="icon"><use href="#i-stats"/></svg>统计
        </button>
        <button type="button" data-tab="gateway">
          <svg class="icon"><use href="#i-gateway"/></svg>网关取用
        </button>
      </div>
    </nav>

    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>
</body>
</html>
