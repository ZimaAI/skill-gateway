<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skill-gateway plugin prototype</title>
<!--
PROTOTYPE: skill-gateway 插件 UI 原型（一次性代码，不进生产）

原型问题：
  在真实 Harness 密度下，侧边栏入口 + 「场景树管理」 + 「统计」两个 tab 的工作流是否顺手？
  网关工具 find / browse / load 的渐进式取用和 usage observer 能否被非开发者看懂？

假设与边界：
  - 这是 UI 分支的功能原型：用真实可点的界面验证流程，而不是静态稿。
  - 核心逻辑以纯函数形式写在 <script> 中，输入输出为纯 JSON，后续可提走。
  - 状态仅存内存，刷新即重置；不做真实文件持久化。
  - 上传支持文件夹（webkitdirectory）；大文件只保留文本或占位。

设计方向（按 frontend-design skill）：
  - 主题：skill gateway 是一道闸门 + 路由台。签名元素是面板顶部的「双路由信号条」，
    它把 gateway on/off、默认技能旁路、usage observer 恒开这三件事画成一条可读的线路。
  - 色板：mineral paper / spruce ink / gate green。单一强调色，深浅两套 token。
  - 字体：系统 UI 字体 + mono 数据标签；无外链依赖。
  - 动效：仅面板滑入和 load 脉冲；prefers-reduced-motion 下全部关闭。
-->
<style>
:root{
  color-scheme: light;
  --bg:#E7EDE9;
  --bg-soft:#EDF2EE;
  --surface:#F6F8F6;
  --surface-2:#FCFDFC;
  --ink:#17251F;
  --ink-2:#3D4E47;
  --muted:#5D6E66;
  --faint:#63736B;
  --line:#D3DDD7;
  --line-strong:#B8C6BF;
  --accent:#2F6B56;
  --accent-hover:#245542;
  --accent-soft:#DCEAE3;
  --on-accent:#F2F9F5;
  --danger:#AE4932;
  --danger-soft:#F7E5DE;
  --on-danger:#FFF6F3;
  --warning:#8A631B;
  --warning-soft:#F4EBD2;
  --agent-source:#4C5B55;
  --agent-source-soft:#E5EAE7;
  --shadow:0 14px 34px rgba(23,37,31,.18);
  --bar-bg:#17251F;
  --bar-ink:#EDF2EE;
  --bar-ink-soft:#C3D0C9;
  --bar-line:#3A4D45;
  --radius:6px;
  --panel-w:692px;
  --font-ui:"Avenir Next","Segoe UI Variable","Segoe UI","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"Cascadia Code","SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#101815;
    --bg-soft:#131F1A;
    --surface:#16211D;
    --surface-2:#1B2823;
    --ink:#E9F0EC;
    --ink-2:#C2CEC8;
    --muted:#91A098;
    --faint:#7E9087;
    --line:#2A3933;
    --line-strong:#3A4D45;
    --accent:#55AD86;
    --accent-hover:#6DBD98;
    --accent-soft:#1B352A;
    --on-accent:#0B1C14;
    --danger:#E18364;
    --danger-soft:#3A221B;
    --on-danger:#26130D;
    --warning:#D8AE58;
    --warning-soft:#342A16;
    --agent-source:#A9B6AF;
    --agent-source-soft:#202C27;
    --shadow:0 18px 40px rgba(0,0,0,.45);
    --bar-bg:#0A0F0D;
    --bar-ink:#D7E2DC;
    --bar-ink-soft:#8FA098;
    --bar-line:#2A3933;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{letter-spacing:.01em}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.mono{font-family:var(--font-mono)}

/* 原型顶部提示条 */
.proto-bar{
  height:36px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  background:var(--bar-bg);
  color:var(--bar-ink);
  font-size:12px;
  position:relative;
  z-index:10;
}
.proto-badge{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.14em;
  background:var(--accent);
  color:var(--on-accent);
  padding:3px 7px;
  border-radius:3px;
  white-space:nowrap;
}
.proto-bar p{
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--bar-ink-soft);
}
.proto-bar .bar-gap{width:1px;height:14px;background:var(--bar-line);flex:0 0 auto}
.proto-actions{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.proto-btn{
  background:transparent;
  border:1px solid var(--bar-line);
  color:var(--bar-ink);
  border-radius:var(--radius);
  padding:4px 9px;
  font-size:12px;
  cursor:pointer;
}
.proto-btn:hover{background:rgba(255,255,255,.08)}

/* 应用外壳 */
.app{
  height:calc(100dvh - 36px);
  display:flex;
  min-height:0;
}
.rail{
  width:236px;
  flex:0 0 auto;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:14px 12px;
  gap:14px;
  min-height:0;
}
.rail-brand{
  display:flex;
  align-items:center;
  gap:8px;
  padding:2px 6px 10px;
  border-bottom:1px solid var(--line);
}
.brand-mark{
  width:24px;height:24px;
  border:1px solid var(--accent);
  border-radius:5px;
  display:grid;
  place-items:center;
  color:var(--accent);
  font-family:var(--font-mono);
  font-size:11px;
  background:var(--accent-soft);
}
.brand-name{font-weight:650;font-size:13px}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.rail-nav{display:grid;gap:4px}
.rail-nav button{
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  border-radius:var(--radius);
  padding:8px 10px;
  cursor:pointer;
  color:var(--ink-2);
  font-size:13px;
}
.rail-nav button:hover{background:var(--bg-soft)}
.rail-nav button.is-active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.rail-spacer{flex:1}
.rail-entry{
  width:100%;
  text-align:left;
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:10px;
  cursor:pointer;
}
.rail-entry:hover{border-color:var(--accent)}
.rail-entry .entry-top{display:flex;align-items:center;gap:8px}
.gate-glyph{
  width:26px;height:16px;
  flex:0 0 auto;
  border:1px solid var(--accent);
  border-radius:3px;
  position:relative;
  background:var(--accent-soft);
}
.gate-glyph i{
  position:absolute;
  left:3px;top:7px;
  width:18px;height:2px;
  background:var(--accent);
  transform-origin:left center;
  transform:rotate(-24deg);
  transition:transform .3s cubic-bezier(.16,1,.3,1);
}
.rail-entry.is-open .gate-glyph i{transform:rotate(0deg)}
.rail-entry .entry-title{font-size:12px;font-weight:650}
.rail-entry .entry-state{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px}
.rail-entry .entry-state b{color:var(--accent);font-weight:600}
.rail-entry .entry-state b.off{color:var(--danger)}

/* 主舞台 */
.stage{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
  background:var(--bg);
}
.stage-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding:18px 22px 14px;
  border-bottom:1px solid var(--line);
  background:var(--bg-soft);
}
.stage-head h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
.stage-head .hint{
  margin:4px 0 0;
  font-size:12px;
  color:var(--muted);
  max-width:68ch;
}
.stage-head .hint b{color:var(--accent);font-weight:650}
.open-panel-btn{
  flex:0 0 auto;
  background:var(--accent);
  border:1px solid var(--accent);
  color:var(--on-accent);
  border-radius:var(--radius);
  padding:8px 12px;
  font-size:12px;
  font-weight:650;
  cursor:pointer;
}
.open-panel-btn:hover{background:var(--accent-hover)}
.transcript{
  flex:1;
  overflow:auto;
  padding:20px 22px 32px;
}
.transcript-inner{max-width:760px;margin:0 auto;display:grid;gap:12px}
.msg{max-width:76%;padding:9px 11px;border-radius:var(--radius);font-size:13px}
.msg-time{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:3px}
.msg-system{
  max-width:100%;
  background:var(--agent-source-soft);
  border:1px dashed var(--line-strong);
  color:var(--ink-2);
  font-family:var(--font-mono);
  font-size:11px;
}
.msg-user{
  justify-self:end;
  background:var(--accent);
  color:var(--on-accent);
  border:1px solid var(--accent);
}
.msg-assistant{
  justify-self:start;
  background:var(--surface);
  border:1px solid var(--line);
}
.msg-tool{
  justify-self:start;
  max-width:100%;
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  padding:0;
  overflow:hidden;
}
.tool-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  background:var(--bg-soft);
  font-family:var(--font-mono);
  font-size:11px;
}
.tool-name{color:var(--accent);font-weight:700}
.tool-input{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-body{padding:9px 10px;font-size:12px;color:var(--ink-2)}
.tool-body .file-row{font-family:var(--font-mono);font-size:11px;padding:3px 0;color:var(--muted)}
.msg-observer{
  justify-self:start;
  max-width:100%;
  display:flex;
  gap:8px;
  align-items:center;
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--muted);
}
.observer-led{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* 插件面板 */
.panel{
  position:absolute;
  top:0;right:0;bottom:0;
  width:min(var(--panel-w),100%);
  background:var(--surface);
  border-left:1px solid var(--line);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  min-height:0;
  transform:translateX(103%);
  visibility:hidden;
  transition:transform .28s cubic-bezier(.16,1,.3,1),visibility 0s linear .28s;
  z-index:20;
}
.panel.is-open{transform:translateX(0);visibility:visible;transition:transform .28s cubic-bezier(.16,1,.3,1)}
.panel-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  background:var(--surface-2);
  flex:0 0 auto;
}
.panel-kicker{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.panel-title{font-size:14px;font-weight:700;margin:0}
.panel-head .head-gap{flex:1}
.switch{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:transparent;
  border:0;
  cursor:pointer;
  padding:4px 6px;
  border-radius:var(--radius);
}
.switch:hover{background:var(--bg-soft)}
.switch .track{
  width:34px;height:19px;
  border-radius:999px;
  background:var(--line-strong);
  position:relative;
  transition:background .2s ease;
}
.switch .knob{
  position:absolute;
  left:2px;top:2px;
  width:15px;height:15px;
  border-radius:50%;
  background:var(--surface-2);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .2s ease;
}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(15px)}
.switch-label{font-size:12px;color:var(--ink-2)}
.icon-btn{
  width:28px;height:28px;
  display:grid;place-items:center;
  background:transparent;
  border:1px solid transparent;
  border-radius:var(--radius);
  cursor:pointer;
  color:var(--muted);
  font-size:16px;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--ink)}

/* 签名元素：双路由信号条 */
.route-strip{
  flex:0 0 auto;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  background:var(--bg-soft);
}
.route-lanes{display:grid;gap:9px}
.route-lane{
  display:grid;
  grid-template-columns:94px 1fr;
  gap:10px;
  align-items:center;
  font-size:11px;
}
.lane-label{
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.1em;
  color:var(--muted);
  line-height:1.3;
}
.route-track{display:flex;align-items:center;min-width:0}
.route-node{
  padding:3px 7px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  background:var(--surface-2);
  white-space:nowrap;
  color:var(--ink-2);
  font-size:11px;
}
.route-wire{
  flex:1;
  height:1px;
  min-width:12px;
  background:var(--line-strong);
  position:relative;
  overflow:visible;
}
.route-wire.is-live{background:var(--accent)}
.gate-node{
  flex:0 0 auto;
  width:30px;height:17px;
  border:1px solid var(--ink-2);
  border-radius:3px;
  position:relative;
  background:var(--surface-2);
}
.gate-node i{
  position:absolute;
  left:4px;top:8px;
  width:20px;height:2px;
  background:var(--ink-2);
  transform-origin:left center;
  transform:rotate(-22deg);
  transition:transform .3s cubic-bezier(.16,1,.3,1),background .2s ease;
}
.route-lane.is-live .gate-node{border-color:var(--accent)}
.route-lane.is-live .gate-node i{background:var(--accent);transform:rotate(0deg)}
.route-lane.is-off{opacity:.48}
.route-lane.is-off .route-node{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--faint)}
.route-pulse{
  position:absolute;
  left:0;top:-2px;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--accent);
  opacity:0;
}
.route-pulse.is-running{animation:route-pulse .85s cubic-bezier(.16,1,.3,1)}
@keyframes route-pulse{
  0%{opacity:.95;left:0}
  100%{opacity:0;left:calc(100% - 5px)}
}
.observer-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:9px;
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.1em;
  color:var(--muted);
}
.observer-row .observer-led{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.observer-row span:last-child{margin-left:auto;color:var(--accent)}

/* tab */
.panel-tabs{
  flex:0 0 auto;
  display:flex;
  gap:2px;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.tab-btn{
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
  padding:10px 11px 9px;
  cursor:pointer;
  color:var(--muted);
  font-size:13px;
}
.tab-btn:hover{color:var(--ink)}
.tab-btn.is-active{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}
.panel-body{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:14px 16px 18px;
}
.panel-foot{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 16px;
  border-top:1px solid var(--line);
  background:var(--surface-2);
  font-size:11px;
  color:var(--muted);
}
.panel-foot .last-event{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.panel-foot b{color:var(--ink-2);font-weight:600}

/* 通用卡片与表单 */
.card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px;
  margin-bottom:12px;
}
.card:last-child{margin-bottom:0}
.card-head{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-bottom:10px;
}
.card-head h3{margin:0;font-size:13px;font-weight:700}
.card-head .card-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.card-head .head-gap{flex:1}
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}
.input,.textarea,.select{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:4px;
  padding:7px 9px;
  font-size:13px;
  color:var(--ink);
}
.textarea{min-height:68px;resize:vertical;line-height:1.45}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.help-text{font-size:11px;color:var(--muted);margin-top:4px}
.btn{
  border-radius:var(--radius);
  border:1px solid var(--line-strong);
  background:var(--surface);
  padding:7px 11px;
  font-size:12px;
  cursor:pointer;
  color:var(--ink-2);
  white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--on-accent);
  font-weight:650;
}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:var(--on-danger)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-strong);color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.segmented{
  display:inline-flex;
  gap:4px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:3px;
}
.segmented button{
  background:transparent;
  border:0;
  border-radius:4px;
  padding:5px 10px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--muted);
  cursor:pointer;
}
.segmented button.is-active{background:var(--surface-2);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 网关 tab */
.gateway-layout{display:grid;gap:12px}
.result-empty{
  border:1px dashed var(--line-strong);
  border-radius:var(--radius);
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}
.match-head{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.path-pill{
  font-family:var(--font-mono);
  font-size:11px;
  background:var(--accent-soft);
  color:var(--accent);
  border:1px solid var(--accent);
  padding:3px 7px;
  border-radius:4px;
}
.match-note{font-size:11px;color:var(--muted)}
.skill-result-list{display:grid;gap:8px}
.skill-result{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:9px 10px;
  background:var(--surface);
}
.skill-result .skill-main{flex:1;min-width:0}
.skill-result strong{font-size:12px;font-family:var(--font-mono)}
.skill-result p{margin:3px 0 0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.json-pre{
  background:var(--bar-bg);
  color:var(--bar-ink);
  border-radius:var(--radius);
  padding:11px;
  font-family:var(--font-mono);
  font-size:10.5px;
  line-height:1.55;
  overflow:auto;
  max-height:240px;
  margin:10px 0 0;
  white-space:pre;
}
details.raw-toggle{margin-top:10px}
details.raw-toggle summary{font-size:11px;color:var(--muted);cursor:pointer}
.file-list{display:grid;gap:5px;margin-top:9px}
.file-list .file-row{
  display:flex;
  gap:8px;

<script>
"use strict";

/* ============================================================
 * 1. 可移植的核心模块（纯函数 / 纯 JSON，不碰 DOM）
 * ============================================================ */
const Core = (() => {
  const NAME_RE = /^[a-z0-9][a-z0-9-]*$/;

  function clone(value){
    return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
  }

  function makeId(prefix){
    return prefix + "_" + Math.random().toString(36).slice(2, 9);
  }

  function normalize(value){
    return String(value || "").toLowerCase().normalize("NFKC");
  }

  function tokenize(text){
    const raw = normalize(text).replace(/[^\p{Script=Han}a-z0-9\s-]/gu, " ");
    const tokens = new Set();
    const latin = raw.match(/[a-z0-9][a-z0-9-]*/g) || [];
    latin.forEach((t) => tokens.add(t));
    const cjkRuns = raw.match(/\p{Script=Han}+/gu) || [];
    cjkRuns.forEach((run) => {
      tokens.add(run);
      if (run.length >= 2){
        for (let i = 0; i < run.length - 1; i += 1){
          tokens.add(run.slice(i, i + 2));
        }
      }
    });
    return [...tokens].filter((t) => t.length >= 2);
  }

  function tokenWeight(token){
    if (token.length >= 3) return 2;
    return 1;
  }

  function sceneMatchScore(scene, tokens){
    const name = normalize(scene.name);
    const desc = normalize(scene.description);
    const tags = (scene.tags || []).map(normalize);
    let score = 0;
    tokens.forEach((token) => {
      const weight = tokenWeight(token);
      if (name.includes(token)) score += weight * 4;
      if (desc.includes(token)) score += weight;
      tags.forEach((tag) => {
        if (tag.includes(token)) score += weight * 2;
      });
    });
    return score;
  }

  function skillMatchScore(skill, tokens){
    if (!skill) return 0;
    const name = normalize(skill.name);
    const desc = normalize(skill.description);
    let score = 0;
    tokens.forEach((token) => {
      const weight = tokenWeight(token);
      if (name.includes(token)) score += weight * 2;
      if (desc.includes(token)) score += weight;
    });
    return score;
  }

  function scenePath(catalog, sceneId){
    const names = [];
    let cursor = catalog.scenes[sceneId];
    let guard = 0;
    while (cursor && guard < 64){
      names.unshift(cursor.name);
      if (!cursor.parentId) break;
      cursor = catalog.scenes[cursor.parentId];
      guard += 1;
    }
    return names.join(" / ");
  }

  function collectSubtree(catalog, sceneId){
    const groups = [];
    const skills = [];
    const sceneIds = [];
    const seenSkills = new Set();
    const queue = [sceneId];
    while (queue.length){
      const id = queue.shift();
      const scene = catalog.scenes[id];
      if (!scene) continue;
      sceneIds.push(id);
      const direct = [];
      (scene.skills || []).forEach((name) => {
        const skill = catalog.skills[name];
        if (!skill || seenSkills.has(name)) return;
        seenSkills.add(name);
        direct.push({ name: skill.name, description: skill.description });
      });
      if (direct.length){
        groups.push({ sceneId: id, path: scenePath(catalog, id), skills: direct });
      }
      skills.push(...direct);
      queue.push(...(scene.children || []));
    }
    return { sceneIds, groups, skills };
  }

  function sceneDepth(catalog, sceneId){
    let depth = 0;
    let cursor = catalog.scenes[sceneId];
    while (cursor && cursor.parentId && catalog.scenes[cursor.parentId]){
      depth += 1;
      cursor = catalog.scenes[cursor.parentId];
    }
    return depth;
  }

  function find(catalog, purpose){
    const tokens = tokenize(purpose);
    if (!tokens.length){
      return { ok: true, purpose, matchedSceneId: null, matchedScenePath: null, matchType: null, groups: [], skills: [], message: "purpose 为空，无法匹配。请输入目的描述。" };
    }

    const scenes = Object.values(catalog.scenes);
    const ranked = scenes.map((scene) => {
      const primary = sceneMatchScore(scene, tokens);
      const subtree = collectSubtree(catalog, scene.id);
      const secondary = subtree.skills.reduce((best, skill) => Math.max(best, skillMatchScore(skill, tokens)), 0);
      return { scene, primary, secondary, depth: sceneDepth(catalog, scene.id) };
    }).filter((item) => item.primary > 0 || item.secondary > 0)
      .sort((a, b) => (b.primary - a.primary) || (b.secondary - a.secondary) || (b.depth - a.depth));

    if (!ranked.length){
      return { ok: true, purpose, matchedSceneId: null, matchedScenePath: null, matchType: null, groups: [], skills: [], message: "没有匹配的场景或技能。换一个目的描述，或先去「场景树管理」扩充目录。" };
    }

    const best = ranked[0];
    const subtree = collectSubtree(catalog, best.scene.id);
    let groups = subtree.groups;
    let skills = subtree.skills;
    if (best.primary === 0){
      const matchedNames = new Set(
        subtree.skills
          .filter((skill) => skillMatchScore(skill, tokens) > 0)
          .map((skill) => skill.name)
      );
      groups = subtree.groups
        .map((group) => ({ ...group, skills: group.skills.filter((skill) => matchedNames.has(skill.name)) }))
        .filter((group) => group.skills.length);
      skills = groups.flatMap((group) => group.skills);
    }
    return {
      ok: true,
      purpose,
      tokens,
      matchedSceneId: best.scene.id,
      matchedScenePath: scenePath(catalog, best.scene.id),
      matchType: best.primary > 0 ? "scene" : "skill-secondary",
      scenePrimaryScore: best.primary,
      skillSecondaryScore: best.secondary,
      groups,
      skills,
      message: null
    };
  }

  function browse(catalog, sceneId){
    const rootId = catalog.rootSceneId;
    const id = sceneId && catalog.scenes[sceneId] ? sceneId : rootId;
    const scene = catalog.scenes[id];
    if (!scene){
      return { ok: false, error: "场景不存在。" };
    }
    const children = (scene.children || []).map((childId) => {
      const child = catalog.scenes[childId];
      return child ? {
        id: child.id,
        name: child.name,
        description: child.description,
        tags: child.tags,
        childCount: (child.children || []).length,
        skillCount: (child.skills || []).length
      } : null;
    }).filter(Boolean);
    const skills = (scene.skills || []).map((name) => {
      const skill = catalog.skills[name];
      return skill ? { name: skill.name, description: skill.description } : null;
    }).filter(Boolean);
    return {
      ok: true,
      sceneId: scene.id,
      path: scenePath(catalog, scene.id),
      name: scene.name,
      description: scene.description,
      tags: scene.tags || [],
      children,
      skills
    };
  }

  function createScene(catalog, parentId, input){
    const next = clone(catalog);
    const parent = next.scenes[parentId];
    if (!parent) return { ok: false, error: "父场景不存在。" };
    const id = makeId("scene");
    next.scenes[id] = {
      id,
      name: String(input.name || "").trim() || "未命名场景",
      description: String(input.description || "").trim(),
      tags: String(input.tags || "").split(",").map((t) => t.trim()).filter(Boolean),
      parentId,
      children: [],
      skills: []
    };
    parent.children.push(id);
    return { ok: true, catalog: next, sceneId: id };
  }

  function updateScene(catalog, sceneId, input){
    const next = clone(catalog);
    const scene = next.scenes[sceneId];
    if (!scene) return { ok: false, error: "场景不存在。" };
    if (typeof input.name === "string") scene.name = input.name.trim() || scene.name;
    if (typeof input.description === "string") scene.description = input.description.trim();
    if (typeof input.tags === "string"){
      scene.tags = input.tags.split(",").map((t) => t.trim()).filter(Boolean);
    }
    return { ok: true, catalog: next };
  }

  function collectDescendants(catalog, sceneId){
    const ids = [];
    const queue = [sceneId];
    while (queue.length){
      const id = queue.shift();
      const scene = catalog.scenes[id];
      if (!scene) continue;
      ids.push(id);
      queue.push(...(scene.children || []));
    }
    return ids;
  }

  function deleteScene(catalog, sceneId){
    const next = clone(catalog);
    if (sceneId === next.rootSceneId){
      return { ok: false, error: "根场景不能删除。" };
    }
    if (!next.scenes[sceneId]){
      return { ok: false, error: "场景不存在。" };
    }
    const ids = collectDescendants(next, sceneId);
    const parent = next.scenes[next.scenes[sceneId].parentId];
    if (parent){
      parent.children = parent.children.filter((id) => id !== sceneId);
    }
    ids.forEach((id) => delete next.scenes[id]);
    return { ok: true, catalog: next, deletedIds: ids };
  }

  function attachSkill(catalog, sceneId, skillName){
    const next = clone(catalog);
    const scene = next.scenes[sceneId];
    if (!scene) return { ok: false, error: "场景不存在。" };
    if (!next.skills[skillName]) return { ok: false, error: "技能不存在。" };
    if (!scene.skills.includes(skillName)) scene.skills.push(skillName);
    return { ok: true, catalog: next };
  }

  function detachSkill(catalog, sceneId, skillName){
    const next = clone(catalog);
    const scene = next.scenes[sceneId];
    if (!scene) return { ok: false, error: "场景不存在。" };
    scene.skills = (scene.skills || []).filter((name) => name !== skillName);
    return { ok: true, catalog: next };
  }

  function upsertSkill(catalog, name, description, now = Date.now()){
    const next = clone(catalog);
    const existing = next.skills[name];
    next.skills[name] = {
      name,
      description: String(description || "").trim(),
      createdAt: existing ? existing.createdAt : now,
      updatedAt: now
    };
    return { ok: true, catalog: next, updated: Boolean(existing) };
  }

  function deleteSkill(catalog, skillName){
    const next = clone(catalog);
    if (!next.skills[skillName]) return { ok: false, error: "技能不存在。" };
    delete next.skills[skillName];
    Object.values(next.scenes).forEach((scene) => {
      scene.skills = (scene.skills || []).filter((name) => name !== skillName);
    });
    return { ok: true, catalog: next };
  }

  function loadSkillFiles(skillFiles, skillName){
    const files = skillFiles[skillName];
    if (!files) return { ok: false, error: "技能「" + skillName + "」的文件不存在。" };
    return { ok: true, skillName, files: clone(files) };
  }

  function recordUsage(usage, input, now = Date.now()){
    const record = {
      id: makeId("use"),
      skillName: input.skillName,
      source: input.source === "agent-skills" ? "agent-skills" : "gateway",
      timestamp: input.timestamp || now,
      sessionId: input.sessionId || "session"
    };
    if (input.scenePath) record.scenePath = input.scenePath;
    return [...usage, record];
  }

  function aggregateUsage(usage, sourceFilter = "all"){
    const filtered = sourceFilter === "all"
      ? usage
      : usage.filter((record) => record.source === sourceFilter);
    const bySkill = new Map();
    const byScene = new Map();
    filtered.forEach((record) => {
      let skill = bySkill.get(record.skillName);
      if (!skill){
        skill = { skillName: record.skillName, count: 0, lastUsed: 0 };
        bySkill.set(record.skillName, skill);
      }
      skill.count += 1;
      skill.lastUsed = Math.max(skill.lastUsed, record.timestamp);
      if (record.scenePath){
        let scene = byScene.get(record.scenePath);
        if (!scene){
          scene = { scenePath: record.scenePath, count: 0, lastUsed: 0 };
          byScene.set(record.scenePath, scene);
        }
        scene.count += 1;
        scene.lastUsed = Math.max(scene.lastUsed, record.timestamp);
      }
    });
    const total = filtered.length;
    const skills = [...bySkill.values()].sort((a, b) => (b.count - a.count) || (b.lastUsed - a.lastUsed));
    const scenes = [...byScene.values()].sort((a, b) => (b.count - a.count) || (b.lastUsed - a.lastUsed));
    return { total, skills, scenes };
  }

  function parseFrontmatter(markdown){
    const match = /^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(markdown || "");
    if (!match){
      return { ok: false, reasons: ["SKILL.md 缺少 frontmatter（需以 --- 开头和结束）"] };
    }
    const fields = {};
    match[1].split(/\r?\n/).forEach((line) => {
      const idx = line.indexOf(":");
      if (idx <= 0) return;
      const key = line.slice(0, idx).trim();
      let value = line.slice(idx + 1).trim();
      if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))){
        value = value.slice(1, -1);
      }
      fields[key] = value;
    });
    return { ok: true, fields };
  }

  function validateUpload(input){
    const paths = (input.files || [])
      .map((file) => String(file.path || "").replace(/\\/g, "/").replace(/^\.\//, ""))
      .filter((path) => path && !path.endsWith("/"));

    if (!paths.length){
      return { ok: false, reasons: ["压缩包或文件夹为空。"], name: null };
    }

    const firstSegments = new Set(paths.map((path) => path.split("/")[0]));
    let root = "";
    let relativePaths = paths;
    if (firstSegments.size === 1 && !paths.includes("SKILL.md")){
      const candidate = [...firstSegments][0];
      const rootSkill = paths.find((path) => path === candidate + "/SKILL.md");
      if (rootSkill){
        root = candidate;
        relativePaths = paths.map((path) => path.slice(candidate.length + 1));
      }
    }

    const reasons = [];
    const rootSkillPaths = relativePaths.filter((path) => path === "SKILL.md");
    if (rootSkillPaths.length !== 1){
      reasons.push("根目录必须且只能有 1 个 SKILL.md，当前 " + rootSkillPaths.length + " 个。");
    }

    if (reasons.length){
      return { ok: false, reasons, name: input.name };
    }

    const skillFile = input.files.find((file) => {
      const path = String(file.path || "").replace(/\\/g, "/").replace(/^\.\//, "");
      const rel = root ? path.slice(root.length + 1) : path;
      return rel === "SKILL.md";
    });
    const parsed = parseFrontmatter(skillFile && skillFile.content);
    if (!parsed.ok){
      reasons.push(...parsed.reasons);
    } else {
      const name = String(parsed.fields.name || "").trim();
      const description = String(parsed.fields.description || "").trim();
      if (!name){
        reasons.push("frontmatter 缺少 name。");
      } else if (!NAME_RE.test(name)){
        reasons.push("name 不符合 [a-z0-9][a-z0-9-]*（小写字母、数字、连字符，且不能以连字符开头）。");
      }
      if (!description){
        reasons.push("frontmatter 缺少非空 description。");
      }
    }

    if (reasons.length){
      return { ok: false, reasons, name: input.name };
    }

    const files = {};
    input.files.forEach((file) => {
      const path = String(file.path || "").replace(/\\/g, "/").replace(/^\.\//, "");
      const rel = root ? path.slice(root.length + 1) : path;
      if (rel) files[rel] = file.content;
    });
    const parsedOk = parseFrontmatter(skillFile.content);
    const skill = {
      name: String(parsedOk.fields.name).trim(),
      description: String(parsedOk.fields.description).trim(),
      files
    };
    return { ok: true, skill, name: input.name };
  }

  function skillPaths(catalog, skillName){
    return Object.values(catalog.scenes)
      .filter((scene) => (scene.skills || []).includes(skillName))
      .map((scene) => scenePath(catalog, scene.id));
  }

  return {
    NAME_RE,
    clone,
    makeId,
    tokenize,
    find,
    browse,
    createScene,
    updateScene,
    deleteScene,
    attachSkill,
    detachSkill,
    upsertSkill,
    deleteSkill,
    loadSkillFiles,
    recordUsage,
    aggregateUsage,
    validateUpload,
    parseFrontmatter,
    scenePath,
    skillPaths
  };
})();

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function fmtTime(ts){
  return new Date(ts).toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function fmtDateTime(ts){
  return new Date(ts).toLocaleString("zh-CN", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function shortPath(path){
  return String(path || "");
}

function toast(message, kind = "info"){
  const stack = $("#toast-stack");
  const node = document.createElement("div");
  node.className = "toast" + (kind === "error" ? " error" : "");
  node.textContent = message;
  stack.appendChild(node);
  setTimeout(() => node.remove(), 3600);
}

function confirmDialog({ title, text, confirmLabel = "确认", danger = false }){
  const dialog = $("#confirm-dialog");
  if (!dialog || typeof dialog.showModal !== "function"){
    return Promise.resolve(window.confirm(text));
  }
  $("#confirm-title").textContent = title;
  $("#confirm-text").textContent = text;
  const ok = $("#confirm-ok");
  const cancel = $("#confirm-cancel");
  ok.textContent = confirmLabel;
  ok.className = "btn " + (danger ? "btn-danger" : "btn-primary");
  return new Promise((resolve) => {
    const cleanup = () => {
      ok.removeEventListener("click", onOk);
      cancel.removeEventListener("click", onCancel);
      dialog.removeEventListener("close", onClose);
    };
    const onOk = () => { cleanup(); dialog.close("ok"); resolve(true); };
    const onCancel = () => { cleanup(); dialog.close("cancel"); resolve(false); };
    const onClose = () => { cleanup(); resolve(dialog.returnValue === "ok"); };
    ok.addEventListener("click", onOk);
    cancel.addEventListener("click", onCancel);
    dialog.addEventListener("close", onClose);
    dialog.showModal();
  });
}

function serializeState(){
  const files = {};

        </div>${body}
      </div>`;
    }
    if (event.role === "usage"){
      const path = event.scenePath ? "  scenePath=" + esc(event.scenePath) : "";
      return `<div class="msg msg-observer">
        <span class="observer-led"></span>
        <span>${time} observer → ${esc(event.source)} skill=${esc(event.skillName)}${path}</span>
      </div>`;
    }
    return "";
  }).join("");
  const transcript = $("#transcript");
  if (transcript) transcript.scrollTop = transcript.scrollHeight;
}

function renderGatewayResult(){
  const result = App.gatewayResult;
  if (!result){
    return `<div class="result-empty">还没有调用。选择 action 后执行，这里会显示结构化的工具返回。</div>`;
  }

  if (result.action === "load"){
    if (!result.ok){
      return `<div class="result-empty">${esc(result.error)}</div>`;
    }
    const files = Object.keys(result.files || {});
    const preview = result.files && result.files["SKILL.md"] ? String(result.files["SKILL.md"]).slice(0, 320) : "";
    return `
      <div class="match-head">
        <span class="path-pill">${esc(result.skillName)}</span>
        <span class="match-note">${files.length} 个文件 / 相对路径 → 内容 map</span>
      </div>
      <div class="file-list">
        ${files.map((path) => `<div class="file-row"><span>${esc(path)}</span><span>${typeof result.files[path] === "string" ? result.files[path].length + " chars" : "binary stub"}</span></div>`).join("")}
      </div>
      ${preview ? `<div class="file-preview">${esc(preview)}</div>` : ""}
      <details class="raw-toggle">
        <summary>查看原始 JSON</summary>
        <pre class="json-pre">${esc(JSON.stringify({ action: "load", skillName: result.skillName, scenePath: result.scenePath || null, files }, null, 2))}</pre>
      </details>`;
  }

  if (result.action === "browse"){
    if (!result.ok) return `<div class="result-empty">${esc(result.error)}</div>`;
    return `
      <div class="match-head">
        <span class="path-pill">${esc(result.path)}</span>
        <span class="match-note">${result.children.length} 个子场景 / ${result.skills.length} 个直接技能</span>
      </div>
      ${result.description ? `<p class="help-text" style="margin:0 0 10px">${esc(result.description)}</p>` : ""}
      <div class="section-label">直接挂载技能</div>
      ${result.skills.length
        ? `<div class="skill-result-list">${result.skills.map((skill) => `
            <div class="skill-result">
              <div class="skill-main">
                <strong>${esc(skill.name)}</strong>
                <p>${esc(skill.description)}</p>
              </div>
              <button class="btn btn-sm" data-action="gateway-action" data-value="load" data-skill="${esc(skill.name)}">load</button>
            </div>`).join("")}</div>`
        : `<div class="result-empty">该场景没有直接挂载技能。</div>`}
      <details class="raw-toggle">
        <summary>查看原始 JSON</summary>
        <pre class="json-pre">${esc(JSON.stringify(result, null, 2))}</pre>
      </details>`;
  }

  if (!result.ok) return `<div class="result-empty">${esc(result.message || result.error || "未知错误")}</div>`;
  if (!result.skills.length) return `<div class="result-empty">${esc(result.message || "没有匹配结果。")}</div>`;

  return `
    <div class="match-head">
      <span class="path-pill">${esc(result.matchedScenePath)}</span>
      <span class="match-note">${result.matchType === "scene" ? "场景主匹配" : "技能次级匹配"} / ${result.skills.length} 个技能已去重</span>
    </div>
    <div class="skill-result-list">
      ${result.groups.map((group) => `
        <div class="section-label">${esc(group.path)}</div>
        ${group.skills.map((skill) => `
          <div class="skill-result">
            <div class="skill-main">
              <strong>${esc(skill.name)}</strong>
              <p>${esc(skill.description)}</p>
            </div>
            <button class="btn btn-sm" data-action="gateway-load-from-result" data-skill="${esc(skill.name)}" data-path="${esc(group.path)}">load</button>
          </div>`).join("")}
      `).join("")}
    </div>
    <details class="raw-toggle">
      <summary>查看原始 JSON</summary>
      <pre class="json-pre">${esc(JSON.stringify({
        action: "find",
        purpose: result.purpose,
        matchedScenePath: result.matchedScenePath,
        matchType: result.matchType,
        skills: result.skills,
        groups: result.groups
      }, null, 2))}</pre>
    </details>`;
}

function renderTree(sceneId, depth = 0){
  const scene = App.catalog.scenes[sceneId];
  if (!scene) return "";
  const collapsed = App.collapsed.has(sceneId);
  const selected = App.selectedSceneId === sceneId;
  const indent = `<span class="depth-indent" style="width:${depth * 14}px"></span>`;
  const twisty = (scene.children || []).length
    ? `<button class="twisty" data-action="toggle-collapse" data-id="${esc(sceneId)}" aria-label="${collapsed ? "展开" : "折叠"} ${esc(scene.name)}">${collapsed ? "▸" : "▾"}</button>`
    : `<span class="twisty"></span>`;
  const row = `
    <div class="tree-row ${selected ? "is-selected" : ""}" data-action="select-scene" data-id="${esc(sceneId)}">
      ${indent}
      ${twisty}
      <button class="tree-name">${esc(scene.name)}</button>
      <span class="tree-meta">${scene.skills.length} 技能 / ${scene.children.length} 子场景</span>
      <span class="tree-actions">
        <button class="btn btn-sm" data-action="add-scene" data-parent="${esc(sceneId)}">+ 子</button>
        ${sceneId !== App.catalog.rootSceneId ? `<button class="btn btn-sm btn-danger" data-action="delete-scene" data-id="${esc(sceneId)}">删</button>` : ""}
      </span>
    </div>`;
  let children = "";
  if (!collapsed){
    children = (scene.children || []).map((childId) => renderTree(childId, depth + 1)).join("");
  }
  return row + children;
}

        ${aggregate.skills.length
          ? `<div class="table-scroll"><table class="stat-table">
              <thead><tr><th>技能</th><th>次数</th><th>占比</th><th>最近使用</th></tr></thead>
              <tbody>${aggregate.skills.map((skill) => `
                <tr>
                  <td>
                    <div class="stat-name">${esc(skill.skillName)}</div>
                    <div class="inline-bar" style="width:${Math.max(8, Math.round(skill.count / maxSkillCount * 92))}px"></div>
                  </td>
                  <td class="stat-num">${skill.count}</td>
                  <td class="stat-share">${total ? (skill.count / total * 100).toFixed(1) : "0.0"}%</td>
                  <td class="stat-share">${fmtDateTime(skill.lastUsed)}</td>
                </tr>`).join("")}
              </tbody>
            </table></div>`
          : `<div class="result-empty">暂无聚合数据。</div>`}
        <div class="table-note">统计只看 source 筛选结果；历史记录在技能删除后仍保留。</div>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>全局统计 / 按场景</h3>
          <span class="card-sub">scenePath 聚合</span>
        </div>
        ${aggregate.scenes.length
          ? `<div class="table-scroll"><table class="stat-table">
              <thead><tr><th>场景路径</th><th>次数</th><th>占比</th></tr></thead>
              <tbody>${aggregate.scenes.map((scene) => `
                <tr>
                  <td class="stat-name" style="white-space:normal;line-height:1.4">${esc(scene.scenePath)}</td>
                  <td class="stat-num">${scene.count}</td>
                  <td class="stat-share">${total ? (scene.count / total * 100).toFixed(1) : "0.0"}%</td>
                </tr>`).join("")}
              </tbody>
            </table></div>`
          : `<div class="result-empty">暂无带场景路径的使用记录。gateway load 时传入 scenePath 后才会出现。</div>`}
        <div class="table-note">agent-skills 来源通常没有 scenePath，因此只出现在按技能统计中。</div>
      </section>
    </div>`;
}

/* ============================================================
 * 6. 行为
 * ============================================================ */
function appendTranscript(event){
  App.transcript.push({ id: Core.makeId("evt"), time: Date.now(), ...event });
  if (App.transcript.length > 40) App.transcript.shift();
}

function addUploadReport(item){
  App.uploadReport.unshift(item);
  if (App.uploadReport.length > 5) App.uploadReport.pop();
}

function triggerRoutePulse(){
  App.routePulse = true;
  renderRouteStrip();
  setTimeout(() => {
    App.routePulse = false;
    renderRouteStrip();
  }, 900);
}

async function handleAction(action, button, event){
  if (action === "open-panel"){
    App.panelOpen = true;
    App.lastEvent = "打开插件面板";
    render();
    return;
  }
  if (action === "close-panel"){
    App.panelOpen = false;
    App.lastEvent = "关闭插件面板";
    render();
    return;
  }
  if (action === "switch-tab"){
    App.activeTab = button.dataset.tab;
    App.lastEvent = "切换 tab：" + App.activeTab;
    render();
    return;
  }
  if (action === "toggle-gateway"){
    App.config.enabled = !App.config.enabled;
    App.lastEvent = App.config.enabled ? "网关已开启：注入工具与提示词" : "网关已关闭：卸载工具与提示词，默认技能加载不变，观察器继续运行";
    render();
    toast(App.lastEvent);
    return;
  }
  if (action === "gateway-action"){
    App.gatewayAction = button.dataset.value;
    if (button.dataset.skill) App.gatewayLoadSkill = button.dataset.skill;
    if (App.gatewayAction === "load" && !App.catalog.skills[App.gatewayLoadSkill]){
      App.gatewayLoadSkill = Object.keys(App.catalog.skills)[0] || "";
    }
    App.lastEvent = "选择 action：" + App.gatewayAction;
    render();
    return;
  }
  if (action === "run-gateway"){
    await runGatewayCall();
    return;
  }
  if (action === "run-demo-flow"){
    await runDemoFlow();
    return;
  }
  if (action === "gateway-load-from-result"){
    const skill = button.dataset.skill;
    const path = button.dataset.path || "";
    App.gatewayAction = "load";
    App.gatewayLoadSkill = skill;
    App.gatewayLoadPath = path;
    await runGatewayCall(path);
    return;
  }
  if (action === "select-scene"){
    App.selectedSceneId = button.dataset.id;
    syncSceneDraft();
    App.lastEvent = "选中场景：" + App.selectedSceneId;
    render();
    return;
  }
  if (action === "toggle-collapse"){
    const id = button.dataset.id;
    if (App.collapsed.has(id)) App.collapsed.delete(id);
    else App.collapsed.add(id);
    App.lastEvent = App.collapsed.has(id) ? "折叠场景：" + id : "展开场景：" + id;
    render();
    return;
  }
  if (action === "add-scene"){
    const parentId = button.dataset.parent || App.selectedSceneId;
    const result = Core.createScene(App.catalog, parentId, {
      name: "新场景",
      description: "描述这个场景对应的工作目的。",
      tags: ""
    });
    if (!result.ok){
      toast(result.error, "error");
      return;
    }
    App.catalog = result.catalog;
    App.selectedSceneId = result.sceneId;
    App.collapsed.delete(parentId);
    syncSceneDraft();
    App.lastEvent = "新建子场景：" + result.sceneId;
    render();
    return;
  }
  if (action === "save-scene"){
    const name = $("#scene-name") ? $("#scene-name").value : App.sceneDraft.name;
    const description = $("#scene-desc") ? $("#scene-desc").value : App.sceneDraft.description;
    const tags = $("#scene-tags") ? $("#scene-tags").value : App.sceneDraft.tags;
    const result = Core.updateScene(App.catalog, App.selectedSceneId, { name, description, tags });
    if (!result.ok){
      toast(result.error, "error");
      return;
    }
    App.catalog = result.catalog;
    syncSceneDraft();
    App.lastEvent = "保存场景：" + App.selectedSceneId;
    render();
    toast("场景已保存。");
    return;
  }
  if (action === "delete-scene"){
    const sceneId = button.dataset.id || App.selectedSceneId;
    const scene = App.catalog.scenes[sceneId];
    if (!scene) return;
    const ok = await confirmDialog({
      title: "删除场景「" + scene.name + "」",
      text: "该场景及其全部子场景会被删除。直接挂载的技能只会解链，技能文件与历史使用统计保留。",
      confirmLabel: "删除场景",
      danger: true
    });
    if (!ok) return;
    const result = Core.deleteScene(App.catalog, sceneId);
    if (!result.ok){
      toast(result.error, "error");
      return;
    }
    App.catalog = result.catalog;
    App.selectedSceneId = App.catalog.rootSceneId;
    syncSceneDraft();
    App.lastEvent = "删除场景：" + sceneId + "（级联删除子场景，技能只解链）";
    render();
    toast(App.lastEvent);
    return;
  }
  if (action === "attach-skill"){
    const select = $("#attach-skill-select");
    const skillName = select ? select.value : "";
    if (!skillName){
      toast("请先选择技能。", "error");
      return;
    }
    const result = Core.attachSkill(App.catalog, App.selectedSceneId, skillName);
    if (!result.ok){
      toast(result.error, "error");
      return;
    }
    App.catalog = result.catalog;
    App.lastEvent = "挂载技能 " + skillName + " → " + App.selectedSceneId;
    render();
    return;
  }
  if (action === "detach-skill"){
    const skillName = button.dataset.skill;
    const result = Core.detachSkill(App.catalog, App.selectedSceneId, skillName);
    if (!result.ok){
      toast(result.error, "error");
      return;
    }
    App.catalog = result.catalog;
    App.lastEvent = "解链技能：" + skillName;
    render();
    return;
  }
  if (action === "delete-skill"){
    const skillName = button.dataset.skill;
    const skill = App.catalog.skills[skillName];
    if (!skill) return;
    const paths = Core.skillPaths(App.catalog, skillName);
    const ok = await confirmDialog({
      title: "删除技能「" + skillName + "」",
      text: "技能会从所有场景解链并移除文件；历史使用统计会保留。\n当前挂载：" + (paths.length ? paths.join(", ") : "无"),
      confirmLabel: "删除技能",
      danger: true
    });
    if (!ok) return;
    const result = Core.deleteSkill(App.catalog, skillName);
    if (!result.ok){
      toast(result.error, "error");
      return;
    }
    App.catalog = result.catalog;
    delete App.skillFiles[skillName];
    App.lastEvent = "删除技能：" + skillName + "（全场景解链 + 移除文件 + 保留统计）";
    render();
    toast(App.lastEvent);
    return;
  }
  if (action === "upload-folder"){
    $("#folder-input").value = "";
    $("#folder-input").click();
    return;
  }
  if (action === "import-sample"){
    await importSampleSkills();
    return;
  }
  if (action === "filter-source"){
    App.sourceFilter = button.dataset.value;
    App.lastEvent = "统计来源筛选：" + App.sourceFilter;
    render();
    return;
  }
  if (action === "simulate-gateway-load"){
    const name = Object.keys(App.catalog.skills)[0];
    if (!name){
      toast("技能目录为空，无法模拟。", "error");
      return;
    }
    const path = Core.skillPaths(App.catalog, name)[0] || null;
    App.usage = Core.recordUsage(App.usage, {
      skillName: name,
      source: "gateway",
      scenePath: path,
      sessionId: App.sessionId
    });
    appendTranscript({ role: "usage", source: "gateway", skillName: name, scenePath: path });
    App.lastEvent = "observer 记录 gateway 使用：" + name;
    render();
    triggerRoutePulse();
    return;
  }
  if (action === "simulate-agent-skill"){
    const name = Object.keys(App.catalog.skills).find((candidate) => candidate !== "tdd") || Object.keys(App.catalog.skills)[0];
    if (!name){
      toast("技能目录为空，无法模拟。", "error");
      return;
    }
    App.usage = Core.recordUsage(App.usage, {
      skillName: name,
      source: "agent-skills",
      scenePath: null,
      sessionId: App.sessionId
    });
    appendTranscript({ role: "usage", source: "agent-skills", skillName: name, scenePath: null });
    App.lastEvent = "observer 记录 agent-skills 使用：" + name;
    render();
    return;
  }
  if (action === "reset-demo"){
    App.catalog = seedCatalog();
    App.usage = seedUsage();
    App.transcript = seedTranscript();
    App.config = { enabled: true };
    App.selectedSceneId = "database";
    App.collapsed = new Set();
    App.gatewayAction = "find";
    App.gatewayPurpose = "数据库设计";
    App.gatewayBrowseSceneId = "root";
    App.gatewayLoadSkill = "db-schema-design";
    App.gatewayResult = null;
    App.sourceFilter = "all";
    App.uploadReport = [];
    App.lastEvent = "演示数据已重置";
    syncSceneDraft();
    render();
    toast("演示数据已重置。");
    return;
  }
  if (action === "toggle-state-drawer"){
    App.stateDrawerOpen = !App.stateDrawerOpen;
    App.lastEvent = App.stateDrawerOpen ? "打开内存状态抽屉" : "关闭内存状态抽屉";
    render();
    return;
  }
}

async function runGatewayCall(forcedPath){
  if (!App.config.enabled){
    toast("网关已关闭，skill_gateway 工具不可用。", "error");
    return;
  }

  if (App.gatewayAction === "find"){
    const purposeInput = $("#gateway-purpose");
    const purpose = (purposeInput ? purposeInput.value : App.gatewayPurpose).trim();
    App.gatewayPurpose = purpose;
    if (!purpose){
      toast("请输入 purpose。", "error");
      return;
    }
    const result = Core.find(App.catalog, purpose);
    App.gatewayResult = { action: "find", ...result };
    const summary = result.matchedScenePath
      ? "命中「" + result.matchedScenePath + "」，返回 " + result.skills.length + " 个技能元数据"
      : (result.message || "无匹配");
    appendTranscript({ role: "tool", tool: "skill_gateway", action: "find", input: purpose, summary });
    App.lastEvent = "find(" + purpose + ")：" + summary;
    if (result.skills.length){
      App.gatewayLoadSkill = result.skills[0].name;
    }
    render();
    return;
  }

  if (App.gatewayAction === "browse"){
    const sceneId = $("#gateway-browse-scene") ? $("#gateway-browse-scene").value : App.gatewayBrowseSceneId;
    App.gatewayBrowseSceneId = sceneId;
    const result = Core.browse(App.catalog, sceneId);
    App.gatewayResult = { action: "browse", ...result };
    const summary = result.ok
      ? "浏览「" + result.path + "」：" + result.children.length + " 个子场景， " + result.skills.length + " 个直接技能"
      : result.error;
    appendTranscript({ role: "tool", tool: "skill_gateway", action: "browse", input: sceneId || "root", summary });
    App.lastEvent = "browse(" + (sceneId || "root") + ")：" + summary;
    render();
    return;
  }

  if (App.gatewayAction === "load"){
    const skillName = $("#gateway-load-skill") ? $("#gateway-load-skill").value : App.gatewayLoadSkill;
    const pathSelect = $("#gateway-load-path");
    const scenePath = forcedPath !== undefined ? forcedPath : (pathSelect ? pathSelect.value : "");
    App.gatewayLoadSkill = skillName;
    const result = Core.loadSkillFiles(App.skillFiles, skillName);
    if (!result.ok){
      App.gatewayResult = { action: "load", ...result };
      App.lastEvent = "load 失败：" + result.error;
      render();
      toast(result.error, "error");
      return;
    }
    App.usage = Core.recordUsage(App.usage, {
      skillName,
      source: "gateway",
      scenePath: scenePath || null,
      sessionId: App.sessionId
    });
    App.gatewayResult = { action: "load", ...result, scenePath: scenePath || null };
    const fileNames = Object.keys(result.files);
    const summary = "返回 " + fileNames.length + " 个文件：" + fileNames.join(", ");
    appendTranscript({ role: "tool", tool: "skill_gateway", action: "load", input: skillName, scenePath: scenePath || null, summary });
    appendTranscript({ role: "usage", source: "gateway", skillName, scenePath: scenePath || null });
    appendTranscript({ role: "assistant", text: "已加载 " + skillName + " 的完整内容，开始按技能执行。" });
    App.lastEvent = "load(" + skillName + ")：" + summary + " / 已记录 gateway 使用";
    render();
    triggerRoutePulse();
    return;
  }
}

async function runDemoFlow(){
  if (!App.config.enabled){
    toast("网关已关闭，无法运行演示闭环。", "error");
    return;
  }
  App.gatewayAction = "find";
  App.gatewayPurpose = "数据库设计";
  const found = Core.find(App.catalog, "数据库设计");
  App.gatewayResult = { action: "find", ...found };
  appendTranscript({ role: "tool", tool: "skill_gateway", action: "find", input: "数据库设计", summary: "命中「" + found.matchedScenePath + "」，返回 " + found.skills.length + " 个技能元数据" });
  if (!found.skills.length){
    render();
    return;
  }
  const skillName = found.skills[0].name;
  const scenePath = found.matchedScenePath;
  App.gatewayAction = "load";
  App.gatewayLoadSkill = skillName;
  const loaded = Core.loadSkillFiles(App.skillFiles, skillName);
  if (loaded.ok){
    App.usage = Core.recordUsage(App.usage, { skillName, source: "gateway", scenePath, sessionId: App.sessionId });
    App.gatewayResult = { action: "load", ...loaded, scenePath };
    appendTranscript({ role: "tool", tool: "skill_gateway", action: "load", input: skillName, scenePath, summary: "返回 " + Object.keys(loaded.files).length + " 个文件" });
    appendTranscript({ role: "usage", source: "gateway", skillName, scenePath });
    appendTranscript({ role: "assistant", text: "渐进式取用完成：先 find 发现元数据，再 load 全文。" });
  }
  App.lastEvent = "完整闭环：find 发现 → load 全文 → 记录 gateway 使用";
  render();
  triggerRoutePulse();
}

/* ---- 上传 ---- */
const TEXT_EXT = /\.(md|markdown|txt|json|ya?ml|toml|css|html?|jsx?|tsx?|sql|py|sh|xml|svg|csv)$/i;

async function filesFromFolder(fileList){
  const groups = new Map();
  for (const file of fileList){
    let path = (file.webkitRelativePath || file.name || "").replace(/\\/g, "/");
    const parts = path.split("/").filter(Boolean);
    let groupName;
    let rel;
    if (parts.length <= 1){
      groupName = file.name;
      rel = file.name;
    } else {
      groupName = parts[0];
      rel = parts.slice(1).join("/");
    }
    if (!groups.has(groupName)) groups.set(groupName, []);
    const content = TEXT_EXT.test(rel)
      ? await file.text()
      : { binary: true, size: file.size, type: file.type || "application/octet-stream" };
    groups.get(groupName).push({ path: rel, content });
  }
  return [...groups.entries()].map(([name, files]) => ({ name, files }));
}


async function importUploads(items){
  for (const item of items){
    const validation = Core.validateUpload(item);
    if (!validation.ok){
      addUploadReport({ name: item.name || "未知上传项", ok: false, reasons: validation.reasons });
      App.lastEvent = "上传校验失败：" + (item.name || "未知上传项");
      render();
      toast("上传校验失败：" + (item.name || "未知上传项"), "error");
      continue;
    }

    const skill = validation.skill;
    const exists = Boolean(App.catalog.skills[skill.name]);
    if (exists){
      const ok = await confirmDialog({
        title: "同名技能已存在：" + skill.name,
        text: "上传将原地更新该技能的内容与描述，保留 name 键和全部历史使用统计。",
        confirmLabel: "更新技能",
        danger: false
      });
      if (!ok){
        addUploadReport({ name: item.name, ok: false, reasons: ["用户取消了同名更新。"] });
        continue;
      }
    }

    const result = Core.upsertSkill(App.catalog, skill.name, skill.description);
    App.catalog = result.catalog;
    App.skillFiles[skill.name] = skill.files;
    addUploadReport({
      name: item.name,
      ok: true,
      detail: exists
        ? "同名更新 " + skill.name + "，历史统计保留"
        : "新增 " + skill.name + "，" + Object.keys(skill.files).length + " 个文件，未自动挂载"
    });
    App.lastEvent = (exists ? "同名更新" : "导入") + "技能：" + skill.name;
    render();
    toast(App.lastEvent);
  }
}

async function importSampleSkills(){
  const sample = {
    name: "sample-incident-review",
    files: [
      { path: "SKILL.md", content: `---
name: sample-incident-review
description: 复盘线上故障的时间线、决策点与改进项，产出可执行的后续行动。
---

# Incident Review

先还原时间线，再找决策点，最后只保留可执行的改进项。
` },
      { path: "checklist.md", content: "1. 影响范围\n2. 恢复动作\n3. 根因\n4. 改进项\n" }
    ]
  };
  await importUploads([sample]);
}

/* ---- 输入事件（不触发整页重绘，保护焦点） ---- */
document.addEventListener("input", (event) => {
  const target = event.target;
  if (target.id === "gateway-purpose"){
    App.gatewayPurpose = target.value;
  } else if (target.id === "scene-name"){
    App.sceneDraft.name = target.value;
  } else if (target.id === "scene-desc"){
    App.sceneDraft.description = target.value;
  } else if (target.id === "scene-tags"){
    App.sceneDraft.tags = target.value;
  }
});

document.addEventListener("change", async (event) => {
  const target = event.target;
  if (target.id === "gateway-browse-scene"){
    App.gatewayBrowseSceneId = target.value;
    render();
  } else if (target.id === "gateway-load-skill"){
    App.gatewayLoadSkill = target.value;
    render();
  } else if (target.id === "gateway-load-path"){
    // 只记在调用时读取
  } else if (target.id === "folder-input" && target.files && target.files.length){
    try{
      const items = await filesFromFolder(target.files);
      await importUploads(items);
    } catch (error){
      toast("文件夹读取失败：" + error.message, "error");
    }
  }
});

document.addEventListener("click", async (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  await handleAction(button.dataset.action, button, event);
});
